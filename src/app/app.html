
<app-header></app-header>

<div class="main-layout">
  <app-sidebar
    [activeModule]="activeModule"
    (moduleSelected)="activeModule = $event">
  </app-sidebar>

  <div class="content">
    @if (activeModule === 'dashboard') {
      <app-dashboard></app-dashboard>
    } @else if (activeModule === 'research-projects') {
      <app-research-projects></app-research-projects>
    } @else if (activeModule === 'laboratories') {
      <app-laboratories></app-laboratories>
    } @else if (activeModule === 'students') {
      <app-students></app-students>
    } @else if (activeModule === 'faculty') {
      <app-faculty></app-faculty>
    } @else if (activeModule === 'equipment') {
      <app-equipment></app-equipment>
    } @else {
      <app-bookings></app-bookings>
    }
  </div>
</div>
